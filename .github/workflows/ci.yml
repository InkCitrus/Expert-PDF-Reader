name: CI

# Every pull request gets exactly one "build" check, so it can be made a required status check for main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version

      - name: Build universal app
        env:
          ARCHS: arm64 x86_64
        run: ./build.sh

      - name: Reader regression checks
        run: ./scripts/test_reader.sh

      - name: Package DMG
        run: ./scripts/make_dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Expert-PDF-Reader-${{ github.sha }}
          path: build/*.dmg
          retention-days: 14
          if-no-files-found: error
