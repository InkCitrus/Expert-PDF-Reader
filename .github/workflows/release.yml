name: Release

# Builds a universal .dmg and attaches it (with SHA256SUMS.txt) to a GitHub Release. Any of these starts it:
#   - pushing a tag such as v0.1.0
#   - publishing a release on GitHub (Releases › Draft a new release, with a new v* tag)
#   - running this workflow from the Actions tab with a version: it creates the tag v<version> on the
#     selected branch and the release
#
# Optional secrets for a Developer ID signed and notarized build (without them the app is ad-hoc signed,
# and users have to allow it once under System Settings › Privacy & Security):
#   MACOS_CERTIFICATE            base64 of the "Developer ID Application" certificate exported as .p12
#   MACOS_CERTIFICATE_PASSWORD   password of that .p12
#   MACOS_SIGNING_IDENTITY       e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_APPLE_ID              Apple ID used for notarization
#   NOTARY_TEAM_ID               Apple Developer team ID
#   NOTARY_PASSWORD              app-specific password of that Apple ID

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0'
        required: true

permissions:
  contents: write

# A release published on GitHub with a new tag can start this twice (tag push + release): run them one after
# the other; the second one just re-uploads the same files.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.3"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build universal app
        env:
          ARCHS: arm64 x86_64
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          CODESIGN_IDENTITY: ${{ env.HAS_SIGNING_CERTIFICATE == 'true' && secrets.MACOS_SIGNING_IDENTITY || '-' }}
        run: ./build.sh

      - name: Package DMG
        env:
          CODESIGN_IDENTITY: ${{ env.HAS_SIGNING_CERTIFICATE == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ./scripts/make_dmg.sh
          cd build && shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" build/*.dmg build/SHA256SUMS.txt --clobber
          else
            # Creates the tag at the built commit when it doesn't exist yet (manual runs)
            gh release create "$TAG" build/*.dmg build/SHA256SUMS.txt --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
