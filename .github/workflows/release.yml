name: Release

# Push a tag such as v0.1.0 to build a universal .dmg and attach it to a GitHub Release.
#
# Optional secrets for a Developer ID signed and notarized build (without them the app is ad-hoc signed,
# and users have to allow it once under System Settings › Privacy & Security):
#   MACOS_CERTIFICATE            base64 of the "Developer ID Application" certificate exported as .p12
#   MACOS_CERTIFICATE_PASSWORD   password of that .p12
#   MACOS_SIGNING_IDENTITY       e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_APPLE_ID              Apple ID used for notarization
#   NOTARY_TEAM_ID               Apple Developer team ID
#   NOTARY_PASSWORD              app-specific password of that Apple ID

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build universal app
        env:
          ARCHS: arm64 x86_64
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          CODESIGN_IDENTITY: ${{ env.HAS_SIGNING_CERTIFICATE == 'true' && secrets.MACOS_SIGNING_IDENTITY || '-' }}
        run: VERSION="${VERSION#v}" ./build.sh

      - name: Package DMG
        env:
          CODESIGN_IDENTITY: ${{ env.HAS_SIGNING_CERTIFICATE == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ./scripts/make_dmg.sh
          cd build && shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/*.dmg build/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/*.dmg build/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes
          fi
